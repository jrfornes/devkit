name: Sandbox CI

on:
  pull_request:
    paths:
      - 'fixtures/nx-angular-sandbox/**'
      - 'harness/**'
      - '.github/workflows/sandbox-ci.yml'
  push:
    paths:
      - 'fixtures/nx-angular-sandbox/**'
      - 'harness/**'
      - '.github/workflows/sandbox-ci.yml'

jobs:
  harness-config:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json

      - name: Install harness dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run build

      - name: Config split tests
        run: npm run test:config

  sandbox:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fixtures/nx-angular-sandbox
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fixtures/nx-angular-sandbox/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test, lint, and build
        run: npx nx run-many -t test,lint,build --skip-nx-cache
